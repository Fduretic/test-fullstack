user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  keepalive_timeout 30;
  client_max_body_size 11m;
  client_body_timeout 30s;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 0.0.0.0:80;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    include /etc/nginx/album-prefix.conf;
    location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
    location /api/ {
      set $backend api:3000;
      proxy_pass http://$backend$uri$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_request_buffering off;
    }
    location = /index.html { add_header Cache-Control 'no-store'; }
    location ~* \.(?:js|css|svg|ico|woff2?)$ { try_files $uri =404; expires 1d; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
